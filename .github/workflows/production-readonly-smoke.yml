name: Production Read-Only Smoke

on:
  push:
    branches:
      - agent/2026-production-hardening

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://bridget-pope-designs.us
      E2E_ALLOW_DESTRUCTIVE: "false"
      E2E_OWNER_USERNAME: ${{ secrets.E2E_OWNER_USERNAME }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require owner credential
        shell: bash
        run: |
          if [ -z "$E2E_OWNER_PASSWORD" ] && [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "No owner/admin E2E password secret is configured; refusing to report a skipped smoke as success."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run read-only production smoke
        run: pnpm exec playwright test tests/e2e/production-audit-smoke.spec.ts --project=chromium --reporter=line

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-readonly-smoke-report
          path: .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
