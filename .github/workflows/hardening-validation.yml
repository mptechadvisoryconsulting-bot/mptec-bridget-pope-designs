name: Hardening Validation

on:
  push:
    branches:
      - agent/2026-production-hardening
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v6
        with:
          ref: agent/2026-production-hardening

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Regenerate lockfile for dependency overrides
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile to maintenance branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Regenerate lockfile for patched transitive dependencies"
          git push origin HEAD:agent/2026-production-hardening

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
