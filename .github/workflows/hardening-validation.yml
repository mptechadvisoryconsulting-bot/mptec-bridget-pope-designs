name: Hardening Validation

on:
  push:
    branches:
      - agent/2026-production-hardening
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Regenerate lockfile for validation
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate
